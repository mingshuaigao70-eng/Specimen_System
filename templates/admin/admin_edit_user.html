<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑用户</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --primary: #2c5f7c;
  --bg: #f5f7fa;
  --text: #303133;
  --text-secondary: #909399;
  --shadow: 0 4px 20px rgba(0,0,0,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card-wrap {
  width: 420px;
  background: #fff;
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card-header {
  background: linear-gradient(135deg, #2c5f7c 0%, #3d7ea6 100%);
  color: #fff;
  padding: 24px 28px;
  text-align: center;
}

.card-header h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: .5px;
}

.card-body {
  padding: 28px;
}

.form-label {
  font-size: 14px;
  font-weight: 600;
  color: #606266;
  margin-bottom: 6px;
}

.form-control, .form-select {
  border-radius: 8px;
  border: 1px solid #dcdfe6;
  padding: 9px 14px;
  font-size: 15px;
  transition: border-color .2s, box-shadow .2s;
}

.form-control:focus, .form-select:focus {
  border-color: #409eff;
  box-shadow: 0 0 0 3px rgba(64,158,255,.12);
}

.btn-submit {
  width: 100%;
  padding: 10px;
  background: #409eff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}

.btn-submit:hover {
  background: #337ecc;
  box-shadow: 0 4px 12px rgba(64,158,255,.3);
}

.btn-back {
  display: block;
  text-align: center;
  margin-top: 14px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
}

.btn-back:hover { color: var(--primary); }

/* Flash */
.flash-wrap { padding: 0 28px; }
.flash-wrap .alert {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: -8px;
}
.alert-success { background: #e8f8f0; color: #155724; border-left: 4px solid #27ae60; }
.alert-error   { background: #fef0f0; color: #721c24; border-left: 4px solid #e74c3c; }
</style>
</head>
<body>

<div class="card-wrap">
  <div class="card-header">
    <h2>编辑用户</h2>
  </div>

  <div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  </div>

  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">角色</label>
        <select name="role" class="form-select">
          <option value="superadmin" {% if user.role == 'superadmin' %}selected{% endif %}>超级管理员</option>
          <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>管理员</option>
          <option value="user" {% if user.role == 'user' %}selected{% endif %}>普通用户</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">保存修改</button>
    </form>
    <a href="javascript:history.back()" class="btn-back">&larr; 返回上一页</a>
  </div>
</div>

</body>
</html>
