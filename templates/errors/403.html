<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 — 禁止访问</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --abyss: #0a2a38; --teal: #177f7f; --gold: #c4943a; --cream: #f7f5ef; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
        radial-gradient(ellipse 600px 400px at 30% 20%, rgba(23,127,127,.06) 0%, transparent 60%),
        radial-gradient(ellipse 500px 350px at 70% 70%, rgba(196,148,58,.04) 0%, transparent 50%),
        var(--cream);
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
}
.error-card {
    text-align: center; padding: 52px 44px;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 24px;
    box-shadow: 0 8px 40px rgba(10,42,56,.10);
    max-width: 460px; width: 90%;
    border: 1px solid rgba(0,0,0,.05);
}
.error-code {
    font-family: "Noto Serif SC", Georgia, serif;
    font-size: 96px; font-weight: 900; color: #c96e4e;
    line-height: 1; margin-bottom: 4px;
    text-shadow: 0 2px 20px rgba(201,110,78,.15);
}
.error-title {
    font-family: "Noto Serif SC", Georgia, serif;
    font-size: 22px; color: var(--abyss); font-weight: 700;
    margin-bottom: 10px; letter-spacing: 2px;
}
.error-desc { font-size: 14px; color: #7d8b91; margin-bottom: 32px; line-height: 1.7; }
.btn-home {
    display: inline-block; padding: 12px 36px;
    background: linear-gradient(135deg, var(--teal) 0%, #0f6b6b 100%);
    color: #fff; border-radius: 50px; text-decoration: none;
    font-size: 15px; font-weight: 600; letter-spacing: 1px;
    transition: all .3s; box-shadow: 0 4px 20px rgba(23,127,127,.2);
}
.btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(23,127,127,.3); }
</style>
</head>
<body>
<div class="error-card">
    <div class="error-code">403</div>
    <div class="error-title">禁入水域</div>
    <div class="error-desc">您没有权限访问此区域<br>如需帮助请联系管理员。</div>
    <a href="{{ url_for('main.index') }}" class="btn-home">返回首页</a>
</div>
</body>
</html>
